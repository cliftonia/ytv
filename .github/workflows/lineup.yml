name: lineup

# Rebuild part of the dial every night and commit the result.
#
# This is the job that replaced a cron on a mini-pc at home. The televisions read channels.json
# straight from this branch, so a successful run here IS the update reaching them - there is no
# publish step and nothing to be switched on for it to work.
#
# Only a slice of the dial is refreshed each night. The whole thing turns over in a fortnight,
# which is slow enough that a channel never feels like it resets under the viewer and fast enough
# that nothing on it is ever months old.

on:
  schedule:
    # 03:00 in Brisbane, which is UTC+10 and has no daylight saving to complicate it.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      rotate:
        description: "How many channels to refresh"
        required: false
        default: "8"
      only:
        description: "A single channel slug, for checking one query"
        required: false

permissions:
  contents: write

concurrency:
  # Two refreshes writing confs at once would interleave their commits and one would lose. A
  # skipped nightly run costs nothing: the rotation cursor lives in the confs themselves, so the
  # next run picks up exactly where this one would have.
  group: lineup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          # No token in .git/config. This job installs the newest yt-dlp on every run - which is
          # the right call for yt-dlp, since YouTube breaks it without notice - but it means
          # freshly downloaded third-party code executes in a job that can push to the branch two
          # televisions fetch directly. The commit step sets its own remote instead.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        # Newest release every night, deliberately unpinned. YouTube changes what it serves
        # without notice and yt-dlp is usually fixed within hours; pinning would mean the dial
        # quietly stops refreshing until someone notices and bumps a version.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp

      - name: Refresh a slice of the dial
        working-directory: curation
        # Through the environment rather than interpolated into the script. `${{ }}` is
        # substituted into the shell text before bash sees it, so an input containing a quote
        # and a semicolon would run as a command - and this repository is public.
        env:
          ONLY: ${{ github.event.inputs.only }}
          ROTATE: ${{ github.event.inputs.rotate || '8' }}
        run: |
          if [ -n "$ONLY" ]; then
            python3 refresh_channels.py --only "$ONLY"
          else
            python3 refresh_channels.py --rotate "$ROTATE"
          fi

      - name: Put each series in episode order
        working-directory: curation
        run: python3 sequence.py

      - name: Rebuild channels.json
        working-directory: curation
        run: python3 build_lineup.py

      - name: Test
        # After the rebuild, because the suite checks the real channels.json as well as the code -
        # a duplicate channel number or a live stream carrying a video id is only visible once the
        # file exists.
        working-directory: curation
        run: python3 -m unittest discover -s tests -v

      - name: Check the lineup against the one it replaces
        # The televisions have no way to reject a bad lineup - they cache whatever parses - so
        # this is the only gate. It compares against the COMMITTED file rather than testing
        # absolute floors, because the failure that actually happens is a slice of the dial
        # collapsing while the totals stay healthy: eight channels dropping to one clip each
        # still leaves 8231 clips across 108 channels, which sailed through the old absolute
        # guards. A channel reduced to one clip loops one programme forever.
        run: |
          git show HEAD:channels.json > /tmp/previous.json 2>/dev/null || echo '{}' > /tmp/previous.json
          python3 - <<'PY'
          import json, sys

          dial = json.load(open("channels.json"))
          channels = dial["channels"]
          clips = sum(len(c["streams"]) for c in channels)
          print("%d channels, %d clips" % (len(channels), clips))

          problems = []
          if len(channels) < 50:
              problems.append("only %d channels - a collapsed dial" % len(channels))
          if clips < 500:
              problems.append("only %d clips - an empty dial" % clips)

          numbers = [c["number"] for c in channels]
          if len(numbers) != len(set(numbers)):
              problems.append("duplicate channel numbers")

          # A youtube channel this thin repeats itself constantly; below 10 it is one programme
          # on a loop, which is worse than the channel being absent.
          for c in channels:
              if c["kind"] == "youtube" and len(c["streams"]) < 10:
                  problems.append("%s (ch %d) has only %d clips"
                                  % (c["name"], c["number"], len(c["streams"])))
              if c["kind"] == "youtube" and c.get("rotation") != "clock":
                  problems.append("%s (ch %d) has rotation %r, so it would replay clip 0 forever"
                                  % (c["name"], c["number"], c.get("rotation")))

          # The youtube block must stay contiguous. A channel that empties is dropped silently by
          # build_lineup, and the viewer just finds a number missing.
          yt = sorted(c["number"] for c in channels if c["kind"] == "youtube")
          if yt and yt != list(range(1, len(yt) + 1)):
              missing = [n for n in range(1, max(yt) + 1) if n not in yt]
              problems.append("gaps in the youtube block: %s" % missing)

          previous = json.load(open("/tmp/previous.json")).get("channels", [])
          if previous:
              was = {c["number"]: len(c["streams"]) for c in previous}
              now = {c["number"]: len(c["streams"]) for c in channels}
              for number, before in was.items():
                  after = now.get(number, 0)
                  # Half is the threshold because a refresh legitimately replaces a channel's
                  # whole list; what it must never do is come back with a fraction of one.
                  if before >= 20 and after < before // 2:
                      problems.append("ch %d fell from %d clips to %d" % (number, before, after))
              for number in was:
                  if number not in now:
                      problems.append("ch %d disappeared" % number)

          if problems:
              print("\nREFUSING TO PUBLISH:")
              for p in problems:
                  print("  " + p)
              sys.exit(1)
          PY

      - name: Commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lineup"
          git config user.email "lineup@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add channels.json curation/confs
          # Nothing to commit is a normal outcome: a refresh can legitimately find the same clips
          # it found last time, and that must not fail the run.
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh the dial

          - Update \`channels.json\` and the confs behind it"
          git push
