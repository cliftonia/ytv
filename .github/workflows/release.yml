name: release

# Build a signed apk and publish it as a release, which is where the televisions look for updates.
#
# Separate from the nightly lineup on purpose. Content changes every night and must never need a
# person; the app changes rarely and, when it does, it is worth being deliberate about - a bad
# lineup fixes itself on the next run, while a bad apk has to be sideloaded off a device by hand.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Version stamp
        # yyDDDHHmm - two-digit year, day of year, hour, minute. It has to be an ascending Int
        # for Android to consider one build newer than another, and yyyyMMddHHmm overflows Int.
        # The tag carries the same number so the update check can read it without downloading
        # anything.
        id: version
        run: echo "code=$(date -u '+%y%j%H%M')" >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        # Absent on a fork, or before the secrets have been set. The build still runs and still
        # produces an apk; it simply is not one the televisions can install as an update, and
        # saying so here is better than a signing error 200 lines into gradle output.
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no keystore secret set - building unsigned" >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ytv-release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        env:
          YTV_VERSION: ${{ steps.version.outputs.code }}
          YTV_KEYSTORE: ${{ steps.keystore.outputs.present == 'true' && format('{0}/ytv-release.jks', runner.temp) || '' }}
          YTV_KEYSTORE_PASSWORD: ${{ secrets.YTV_KEYSTORE_PASSWORD }}
          YTV_KEY_ALIAS: ytv
        run: ./gradlew :app:assembleRelease

      - name: Name the apk after nothing in particular
        # The televisions find the asset by its .apk suffix, not by name, but a file called
        # app-release.apk in a downloads folder is indistinguishable from every other Android
        # project's output.
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/ytv.apk"
          ls -la out

      - name: Publish the release
        if: steps.keystore.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.code }}
        run: |
          # The tag IS the version, because that is what the app compares against its own
          # versionCode. A release tagged anything else is invisible to the update check.
          gh release create "v$VERSION" out/ytv.apk \
            --title "v$VERSION" \
            --notes "Automated build. The televisions pick this up on their next launch." \
            --repo "$GITHUB_REPOSITORY"

      - name: Keep the apk even when it cannot be released
        if: steps.keystore.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ytv-unsigned
          path: out/ytv.apk
